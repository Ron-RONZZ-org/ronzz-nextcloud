# Hesk help desk — threads.ronzz.org (issue follow-up on Zammad/Vikunja research)
# Staff panel (/admin/) gated behind Nextcloud login via OIDC (H2CK/oidc IdP):
#   nginx auth_request -> sidecar (127.0.0.1:8016) -> session cookie heskauth
#   on 401 the browser is bounced to /_oidc/login -> NC authorize -> callback
# The trusted header X-Hesk-User is set ONLY after a successful auth_request and
# overrides any client-supplied value (the PHP location rewrites it). The patched
# Hesk admin/index.php (hesk/patches/hesk-oidc-sso.patch) auto-logs the matching
# staff account in. Public ticket submission/status pages are NOT gated.

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name threads.ronzz.org;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }

    access_log /var/log/nginx/threads.access.log;
    error_log  /var/log/nginx/threads.error.log;
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name threads.ronzz.org;

    ssl_certificate     /etc/letsencrypt/threads.ronzz.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/threads.ronzz.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/hesk;
    index index.php;

    client_max_body_size 50M;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    fastcgi_hide_header X-Powered-By;

    # ---- OIDC gate ----
    set $hesk_user "";   # set by auth_request below; forwarded to Hesk

    # Sidecar endpoints (login/callback/logout/auth/health) — NOT gated
    location /_oidc/ {
        proxy_pass http://127.0.0.1:8016;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Staff panel — gated + identity header. ALL /admin/ PHP must carry X-Hesk-User.
    location ^~ /admin/ {
        auth_request /_oidc/auth;
        auth_request_set $hesk_user $upstream_http_x_hesk_user;
        error_page 401 = @oidc-login;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/hesk-fpm.sock;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param HTTP_X_HESK_USER $hesk_user;   # overrides any client value
        }

        # Non-PHP under /admin/ (static assets) — still gated
        try_files $uri $uri/ =404;
    }

    # Public pages — open (ticket submission, status check, knowledgebase, css/js/img)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Public PHP (index.php, submit_ticket.php, ticket.php, knowledgebase.php, ...)
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/hesk-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    }

    location @oidc-login {
        return 302 /_oidc/login?next=$request_uri;
    }

    # Hesk install/upgrade dir — never reachable once provisioned
    location ~ ^/install/ { deny all; }

    # Forbid dotfiles
    location ~ (^|/)\. { return 403; }

    access_log /var/log/nginx/threads.access.log;
    error_log  /var/log/nginx/threads.error.log;
}
