[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailwatch"
version = "0.1.0"
description = "Headless IMAP IDLE spam/idler daemon for Migadu-hosted mail (derived from lighterbird)"
authors = [{name = "Ron"}]
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "pyyaml>=6.0",
    "managesieve>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.4.0",
]
sieve-validation = [
    "sievelib>=1.2.0",
]

[project.scripts]
mailwatch = "mailwatch.watcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mailwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "asyncio: async tests",
]
timeout = 120

[tool.ruff.lint]
select = [
    "S110", "S112",    # flake8-bandit (security)
    "E", "F",          # pycodestyle + pyflakes
    "I",               # isort
    "B",               # flake8-bugbear
    "SIM",             # flake8-simplify
    "UP",              # pyupgrade
    "RUF",             # Ruff-specific
]
ignore = [
    "B008",            # do not perform function calls in argument defaults
    "B904",            # raise-without-from-inside-except (noisy, low value)
    "E501",            # line-too-long (pre-existing)
    "E741",            # ambiguous-variable-name (single-letter vars are fine)
    "RUF012",          # mutable class attributes
    "RUF059",          # unused-unpacked-variable (too noisy)
    "SIM105",          # suppressible-exception (sometimes pass is intentional)
    "SIM108",          # use ternary operator (prefer if/else for readability)
]
