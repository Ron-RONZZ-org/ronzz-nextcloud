# SnappyMail admin panel — webmail-admin.ronzz.org (issue #7 follow-up)
# Admin access gated behind Nextcloud login via OIDC (H2CK/oidc IdP):
#   nginx auth_request -> sidecar (127.0.0.1:8015) -> session cookie wmauth
#   on 401 the browser is bounced to /_oidc/login -> NC authorize -> callback
# The SnappyMail-side trusted header X-NC-Admin is set ONLY after a successful
# auth_request (client-supplied values are overridden in the PHP location).

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name webmail-admin.ronzz.org;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }

    access_log /var/log/nginx/webmail-admin.access.log;
    error_log  /var/log/nginx/webmail-admin.error.log;
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name webmail-admin.ronzz.org;

    ssl_certificate     /etc/letsencrypt/webmail-admin.ronzz.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/webmail-admin.ronzz.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/snappymail;
    index index.php;

    client_max_body_size 50M;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    fastcgi_hide_header X-Powered-By;

    # ---- OIDC gate ----
    set $nc_admin "";   # set by auth_request below; forwarded to SnappyMail

    # Sidecar endpoints (login/callback/logout/auth/health) — NOT gated
    location /_oidc/ {
        proxy_pass http://127.0.0.1:8015;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Non-PHP: gate + fallback to index.php
    location / {
        auth_request /_oidc/auth;
        auth_request_set $nc_admin $upstream_http_x_nc_admin;
        error_page 401 = @oidc-login;
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP: gate + pass the trusted header (overrides any client-supplied one)
    location ~ \.php$ {
        auth_request /_oidc/auth;
        auth_request_set $nc_admin $upstream_http_x_nc_admin;
        error_page 401 = @oidc-login;
        fastcgi_pass unix:/run/php/snappymail-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param HTTP_X_NC_ADMIN $nc_admin;
    }

    location @oidc-login {
        return 302 /_oidc/login?next=$request_uri;
    }

    # Forbid dotfiles
    location ~ (^|/)\. { return 403; }

    location ~ ^/data/ { deny all; }

    access_log /var/log/nginx/webmail-admin.access.log;
    error_log  /var/log/nginx/webmail-admin.error.log;
}
